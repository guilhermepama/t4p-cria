<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131110">
<title>T4P · Controle do pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131110; --bg-2:#1b1816; --cream:#f3eae0; --muted:#a89e93; --line:#2b2623;
    --accent:#e9a47c; --chip:#f6e9d4; --red:#ff7a5c;
    --sans:'Inter',system-ui,-apple-system,sans-serif; --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
  i{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

  /* pareamento */
  #parear{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px}
  #parear h1{font-weight:900;letter-spacing:-.03em;font-size:34px;line-height:1.05}
  #parear p{color:var(--muted);font-size:15px;line-height:1.5}
  #cod{width:100%;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--bg-2);color:var(--cream);font:900 34px/1 var(--sans);letter-spacing:.3em;text-align:center;text-transform:uppercase}
  #cod:focus{outline:2px solid var(--accent);outline-offset:2px}
  #btnConectar{padding:18px;border-radius:16px;background:var(--accent);color:#1a1614;font-weight:900;font-size:18px}
  #erroPar{color:var(--red);font-size:14px;min-height:1.2em}

  /* controle */
  #ctl{flex:1;display:none;flex-direction:column;min-height:0}
  #ctl.on{display:flex}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
  #dot.ok{background:#7bd88f}
  #status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btnTrocar{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}

  #relogio{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .linha1{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  #pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  #titulo{font-weight:900;letter-spacing:-.02em;font-size:20px;line-height:1.15;margin-top:2px}
  #clock{font-weight:900;letter-spacing:-.04em;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
  #clock.over{color:var(--red)}
  #clock.pausado{opacity:.55}
  .seg{height:6px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
  #segBar{height:100%;width:0;background:var(--accent);transition:width .25s linear}
  #segBar.tarde{background:var(--red)}
  .linha2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
  #aviso.tarde{color:var(--red);font-weight:700}
  .tbtns{display:flex;gap:8px}
  .tbtns button{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--cream)}
  #btnZerar.confirmar{border-color:var(--red);color:var(--red)}

  #guia{flex:1;min-height:0;overflow:auto;padding:14px 16px 8px;-webkit-overflow-scrolling:touch}
  #topicos{list-style:none;display:flex;flex-direction:column;gap:10px}
  #topicos li{position:relative;padding-left:20px;font-size:17px;line-height:1.3;font-weight:600}
  #topicos li::before{content:"";position:absolute;left:2px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ "}
  details[open] summary::before{content:"▾ "}
  #roteiro{margin-top:10px;font-size:16px;line-height:1.55;color:var(--cream)}
  #lista{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  #lista button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
  #lista button.atual{border-color:var(--accent);color:var(--cream)}
  #proximoTitulo{font-size:13px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line)}

  .nav{display:grid;grid-template-columns:1fr 2.4fr;gap:10px;padding:10px 12px 12px;height:max(24vh,130px)}
  .nav button{border-radius:22px;font-weight:900;letter-spacing:-.02em;transition:transform .08s,opacity .15s}
  .nav button:active{transform:scale(.97)}
  #btnAnt{background:var(--bg-2);border:1px solid var(--line);font-size:30px;color:var(--muted)}
  #btnProx{background:var(--accent);color:#1a1614;font-size:30px}
  .nav button:disabled{opacity:.35}

  #toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--red);color:#1a1614;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
  #toast.on{opacity:1}
</style>
</head>
<body>

<section id="parear">
  <h1>Controle do <i>pitch</i></h1>
  <p>No computador, abra o pitch e tecle <b>C</b> (ou toque em “celular” no rodapé). Digite aqui o código que aparecer.</p>
  <input id="cod" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="······" aria-label="Código da tela">
  <button id="btnConectar">Conectar</button>
  <div id="erroPar" role="alert"></div>
</section>

<section id="ctl">
  <header>
    <span id="dot"></span><span id="status">conectando…</span>
    <button id="btnTrocar">trocar código</button>
  </header>

  <div id="relogio">
    <div class="linha1">
      <div style="min-width:0"><div id="pos">– / –</div><div id="titulo">Aguardando a tela…</div></div>
      <button id="clock" aria-label="Pausar ou retomar o cronômetro">0:00</button>
    </div>
    <div class="seg"><div id="segBar"></div></div>
    <div class="linha2">
      <span id="aviso">—</span>
      <span class="tbtns"><button id="btnPlay">▶</button><button id="btnZerar">zerar</button></span>
    </div>
  </div>

  <div id="guia">
    <ul id="topicos"></ul>
    <details id="detRoteiro"><summary>Roteiro completo deste slide</summary><div id="roteiro"></div></details>
    <details><summary>Ir para outro slide</summary><div id="lista"></div></details>
  </div>

  <div id="proximoTitulo"></div>
  <div class="nav">
    <button id="btnAnt" aria-label="Slide anterior">‹</button>
    <button id="btnProx" aria-label="Próximo slide">Próximo ›</button>
  </div>
</section>

<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const TOTAL_PITCH = 120;   // 2:00
const mmss = s => (s < 0 ? '-' : '') + Math.floor(Math.abs(s)/60) + ':' + String(Math.floor(Math.abs(s)%60)).padStart(2,'0');
const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gravar = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

let codigo = (QS.get('c') || ler('pitch-controle-codigo') || '').toUpperCase();
let es = null, estado = null, base = { elapsed: 0, running: false, em: 0 }, telaOn = false, avisou = -1;

/* ---------- pareamento ---------- */
function mostrarParear(msg){
  if (es) { es.close(); es = null; }
  $('ctl').classList.remove('on'); $('parear').style.display = '';
  $('erroPar').textContent = msg || '';
  $('cod').value = codigo || ''; setTimeout(() => $('cod').focus(), 50);
}
function conectar(){
  const c = $('cod').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!/^[A-Z0-9]{6}$/.test(c)) { $('erroPar').textContent = 'O código tem 6 letras ou números.'; return; }
  codigo = c; gravar('pitch-controle-codigo', c); iniciar();
}
$('btnConectar').addEventListener('click', conectar);
$('cod').addEventListener('keydown', e => { if (e.key === 'Enter') conectar(); });
$('btnTrocar').addEventListener('click', () => { gravar('pitch-controle-codigo', null); mostrarParear(); });

function iniciar(){
  $('parear').style.display = 'none'; $('ctl').classList.add('on');
  if (es) es.close();
  es = new EventSource('/pitch-sala/' + codigo + '/eventos?papel=controle');
  es.addEventListener('open', () => atualizarStatus());
  es.addEventListener('error', () => { telaOn = false; atualizarStatus('sem conexão · tentando de novo…'); });
  es.addEventListener('presenca', ev => { telaOn = JSON.parse(ev.data).tela; atualizarStatus(); if (telaOn) enviar('sincronizar', undefined, true); });
  es.addEventListener('estado', ev => { estado = JSON.parse(ev.data); base = { elapsed: estado.timer.elapsed, running: estado.timer.running, em: performance.now() }; render(); });
  pedirTelaAcesa();
}
function atualizarStatus(msg){
  $('dot').classList.toggle('ok', telaOn);
  $('status').textContent = msg || (telaOn ? 'conectado à tela · ' + codigo : 'tela desconectada · ' + codigo);
  $('btnProx').disabled = $('btnAnt').disabled = !telaOn;
}

/* ---------- comandos ---------- */
let toastId = null;
function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastId); toastId = setTimeout(() => $('toast').classList.remove('on'), 2200); }
async function enviar(acao, n, silencioso){
  if (!silencioso && navigator.vibrate) navigator.vibrate(15);
  try {
    const r = await fetch('/pitch-sala/' + codigo, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo: 'comando', dados: { acao, n } }) });
    if (r.status === 409 && !silencioso) toast('A tela não está conectada. Recarregue o pitch no computador.');
    else if (!r.ok && !silencioso) toast('Não enviou (' + r.status + '). Use o teclado.');
  } catch (e) { if (!silencioso) toast('Sem internet no celular. Use o teclado.'); }
}
$('btnProx').addEventListener('click', () => enviar('proximo'));
$('btnAnt').addEventListener('click', () => enviar('anterior'));
$('clock').addEventListener('click', () => enviar('cronometro'));
$('btnPlay').addEventListener('click', () => enviar('cronometro'));
let zerarId = null;
$('btnZerar').addEventListener('click', () => {
  const b = $('btnZerar');
  if (b.classList.contains('confirmar')) { clearTimeout(zerarId); b.classList.remove('confirmar'); b.textContent = 'zerar'; enviar('zerar'); return; }
  b.classList.add('confirmar'); b.textContent = 'toque de novo';
  zerarId = setTimeout(() => { b.classList.remove('confirmar'); b.textContent = 'zerar'; }, 2500);
});

/* ---------- tela ---------- */
function render(){
  if (!estado) return;
  const { cur, total, titulos, notas, topicos } = estado;
  $('pos').textContent = (cur + 1) + ' / ' + total;
  $('titulo').textContent = titulos[cur] || '';
  const ul = $('topicos'); ul.textContent = '';
  (topicos[cur] || []).forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  $('roteiro').textContent = notas[cur] || '';
  $('proximoTitulo').textContent = cur + 1 < total ? 'Próximo: ' + titulos[cur + 1] : 'Último slide';
  $('btnProx').textContent = cur + 1 < total ? 'Próximo ›' : 'Fim';
  const lista = $('lista'); lista.textContent = '';
  titulos.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + t + (i > 0 ? '  ·  ' + mmss(estado.inicios[i]) : '');
    if (i === cur) b.className = 'atual';
    b.addEventListener('click', () => enviar('ir', i));
    lista.appendChild(b);
  });
  $('guia').scrollTop = 0;
  avisou = -1;
  tick();
}
function tick(){
  const el = base.elapsed + (base.running ? (performance.now() - base.em) / 1000 : 0);
  const clock = $('clock');
  clock.textContent = mmss(el);
  clock.classList.toggle('over', el > TOTAL_PITCH);
  clock.classList.toggle('pausado', !base.running);
  $('btnPlay').textContent = base.running ? '❚❚' : '▶';
  if (!estado) return;
  const { cur, total, inicios } = estado;
  const ini = inicios[cur] || 0, fim = cur + 1 < total ? inicios[cur + 1] : TOTAL_PITCH;
  const aviso = $('aviso'), bar = $('segBar');
  if (cur === 0) { aviso.textContent = 'o cronômetro começa ao passar da capa'; aviso.classList.remove('tarde'); bar.style.width = '0'; bar.classList.remove('tarde'); return; }
  const resta = fim - el, dur = Math.max(1, fim - ini);
  bar.style.width = Math.max(0, Math.min(100, (el - ini) / dur * 100)) + '%';
  const tarde = resta < 0;
  bar.classList.toggle('tarde', tarde); aviso.classList.toggle('tarde', tarde);
  aviso.textContent = cur + 1 < total
    ? (tarde ? 'passe o slide · atrasado ' + mmss(-resta) : 'esta parte até ' + mmss(fim) + ' · faltam ' + mmss(resta))
    : (tarde ? 'passou de 2:00 · encerre' : 'encerrar até 2:00 · faltam ' + mmss(resta));
  if (tarde && base.running && avisou !== cur) { avisou = cur; if (navigator.vibrate) navigator.vibrate([60, 60, 60]); }
}
setInterval(tick, 250);

/* ---------- manter a tela acesa ---------- */
let wake = null;
async function pedirTelaAcesa(){
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pedirTelaAcesa(); if (es && es.readyState === 2) iniciar(); } });
document.addEventListener('click', pedirTelaAcesa);

if (/^[A-Z0-9]{6}$/.test(codigo)) { $('cod').value = codigo; iniciar(); } else mostrarParear();
</script>
</body>
</html>

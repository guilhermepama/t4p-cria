<link rel="icon" href="/favicon.ico" sizes="any">

<style>
  :root{
    --bg:#0b0b0d; --card:#141419; --border:#232329; --text:#f2ede4;
    --muted:#9b9aa3; --orange:#ee8148;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Inter',system-ui,-apple-system,sans-serif; line-height:1.6;
  }
  h1{font-family:'Inter Tight',sans-serif; font-weight:800; font-size:26px; margin-bottom:14px}
  .card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:32px 28px; text-align:center;
  }
  p{color:var(--muted); font-size:15px}
  p a{color:var(--orange)}
  footer{margin-top:22px; text-align:center; font-size:12.5px; color:var(--muted)}
  footer a{color:var(--orange)}
</style>
</head>
<body>
  <div class="card">

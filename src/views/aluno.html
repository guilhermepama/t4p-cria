<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do aluno | IA para Negócios — T4P</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --card:#141419; --border:#232329; --text:#f2ede4;
    --muted:#9b9aa3; --orange:#ee8148;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text); min-height:100vh; padding:24px;
    font-family:'Inter',system-ui,-apple-system,sans-serif; line-height:1.6;
  }
  .wrap{max-width:720px; margin:0 auto}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; gap:12px; flex-wrap:wrap}
  h1{font-family:'Inter Tight',sans-serif; font-weight:800; font-size:26px}
  h2{font-family:'Inter Tight',sans-serif; font-weight:700; font-size:18px; margin:32px 0 14px}
  .sair{
    border:1px solid var(--border); border-radius:999px; padding:9px 20px; background:transparent;
    color:var(--text); font-family:'Inter Tight',sans-serif; font-weight:600; cursor:pointer;
  }
  .grid{display:grid; gap:14px; grid-template-columns:1fr}
  @media(min-width:640px){ .grid{grid-template-columns:1fr 1fr 1fr} }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px;
    display:flex; flex-direction:column; gap:10px;
  }
  .card h3{font-family:'Inter Tight',sans-serif; font-size:16px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:999px; padding:10px 20px; border:none; cursor:pointer; text-decoration:none;
    background:linear-gradient(96deg,#f6c49a 10%,var(--orange) 90%); color:#1a1006;
    font-family:'Inter Tight',sans-serif; font-weight:700; font-size:14.5px; margin-top:auto;
  }
  .downloads{display:flex; flex-direction:column; gap:10px}
  .download{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px;
  }
  .download span{font-size:14.5px}
  .download a{
    color:var(--orange); text-decoration:none; font-weight:600; font-size:14px; white-space:nowrap;
  }
  footer{margin-top:32px; text-align:center; font-size:12.5px; color:var(--muted)}
  footer a{color:var(--orange)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Olá, {{nome}}</h1>
      <form method="POST" action="/sair">
        <button class="sair" type="submit">Sair</button>
      </form>
    </header>

    <h2>Suas aulas</h2>
    <div class="grid">
      {{{aulasHtml}}}
    </div>

    <h2>Seus arquivos</h2>
    <div class="downloads">
      {{{downloadsHtml}}}
    </div>

    <footer>Dúvidas? <a href="{{linkWhatsapp}}" target="_blank" rel="noopener">WhatsApp {{whatsappFmt}}</a></footer>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprar | IA para Negócios — T4P</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --card:#141419; --border:#232329; --text:#f2ede4;
    --muted:#9b9aa3; --orange:#ee8148;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Inter',system-ui,-apple-system,sans-serif; line-height:1.6;
  }
  h1{font-family:'Inter Tight',sans-serif; font-weight:800; font-size:26px; margin-bottom:14px}
  .card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:32px 28px; text-align:center;
  }
  p{color:var(--muted); font-size:15px}
  footer{margin-top:22px; text-align:center; font-size:12.5px; color:var(--muted)}
  footer a{color:var(--orange)}
</style>
</head>
<body>
  <div class="card">
    <h1>Comprar</h1>
    <p>A compra online abre em instantes. Se preferir, fale com a gente e pague por PIX direto.</p>
    <footer><a href="/privacidade">Privacidade</a></footer>
  </div>
</body>
</html>

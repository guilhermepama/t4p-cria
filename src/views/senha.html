<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alterar senha | IA para Negócios — T4P</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --card:#141419; --border:#232329; --text:#f2ede4;
    --muted:#9b9aa3; --orange:#ee8148; --red:#e07b6a; --green:#4ade80;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Inter',system-ui,-apple-system,sans-serif; line-height:1.6;
  }
  h1{font-family:'Inter Tight',sans-serif; font-weight:800; font-size:28px; margin-bottom:8px}
  .card{
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:32px 28px;
  }
  p.sub{color:var(--muted); font-size:14.5px; margin-bottom:8px}
  label{display:block; font-size:14px; font-weight:600; margin-bottom:6px; margin-top:16px}
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:#0f0f12; color:var(--text); font-size:15px;
  }
  input:focus{outline:2px solid var(--orange)}
  .dica{font-size:12.5px; color:var(--muted); margin-top:6px}
  .btn{
    display:inline-flex; width:100%; align-items:center; justify-content:center;
    border-radius:999px; padding:13px 26px; margin-top:24px; border:none; cursor:pointer;
    background:linear-gradient(96deg,#f6c49a 10%,var(--orange) 90%); color:#1a1006;
    font-family:'Inter Tight',sans-serif; font-weight:700; font-size:16px;
  }
  .erro{
    background:rgba(224,123,106,.12); border:1px solid var(--red); color:var(--red);
    border-radius:10px; padding:10px 14px; font-size:14px; margin-top:16px;
  }
  .ok{
    background:rgba(74,222,128,.10); border:1px solid var(--green); color:var(--green);
    border-radius:10px; padding:10px 14px; font-size:14px; margin-top:16px;
  }
  footer{margin-top:22px; text-align:center; font-size:13.5px; color:var(--muted)}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--orange)}
  footer p{margin-bottom:8px}
</style>
</head>
<body>
  <div class="card">
    <h1>Alterar senha</h1>
    <p class="sub">Informe a senha atual e escolha uma nova.</p>
    {{{mensagemErro}}}
    {{{mensagemOk}}}
    <form method="POST" action="/aluno/senha" id="form-senha">
      <label for="senhaAtual">Senha atual</label>
      <input type="password" id="senhaAtual" name="senhaAtual" required autocomplete="current-password" maxlength="200">
      <label for="senhaNova">Nova senha</label>
      <input type="password" id="senhaNova" name="senhaNova" required minlength="8" maxlength="200" autocomplete="new-password">
      <p class="dica">Mínimo de 8 caracteres.</p>
      <label for="senhaConfirmacao">Repita a nova senha</label>
      <input type="password" id="senhaConfirmacao" name="senhaConfirmacao" required minlength="8" maxlength="200" autocomplete="new-password">
      <button class="btn" type="submit">Salvar nova senha</button>
    </form>
    <footer>
      <p><a href="/aluno">← Voltar para a área do aluno</a></p>
      <p>Esqueceu a senha atual? <a href="{{linkWhatsapp}}" target="_blank" rel="noopener">Fale com a gente no WhatsApp</a>.</p>
    </footer>
  </div>
</body>
</html>
